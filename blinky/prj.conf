CONFIG_GPIO=y


CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y

CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_DEFAULT_LEVEL=3

#CONFIG_SUM_PRINT=y
CONFIG_SUM_LOG=y

# Sensor framework + I2C
CONFIG_SENSOR=y
CONFIG_I2C=y
CONFIG_CBPRINTF_FP_SUPPORT=y
# Let TF-M release peripheral instance 1 to the non-secure application
CONFIG_TFM_SECURE_UART_SHARE_INSTANCE=y